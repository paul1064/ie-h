name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run all skill unit tests & invariant checks
        run: npm test
      - name: Verify hard completion signal
        run: |
          node .claude/skills/goal-signal-check/scripts/verify.mjs \
            --cmd "node tools/check-skills.mjs" \
            --stdout "abweichungen=0" \
            --git-clean
